name: AI Agent for software testing
run-name: ${{ github.event.client_payload.runName }}

on:
  repository_dispatch:
    types: [agent, crawl]

jobs:
  test:
    name: ${{ github.event.action}}
    # Both labels must match: `wopee` pins the job to Wopee's own runner fleet
    # now that other runners share the org. A tenant whose fleet uses another
    # label gets this line rewritten by infra's utils/repo-sync.sh.
    runs-on: [self-hosted, wopee]
    steps:
      - uses: Wopee-io/run-agent@v1
        env:
          WOPEE_API_KEY: ${{ secrets.WOPEE_API_KEY }}
